name: Bug report
description: Something behaves differently from how it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See the organization's
        [security policy](https://github.com/mckinley-and-rice/.github/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw. A screenshot of the actual window beats a description of it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, starting from a state someone else can reach.
      placeholder: |
        1. Open ...
        2. Click ...
        3. The screen shows ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit you are on. "latest" is not a version.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.3 arm64 / Windows 11 24H2 / Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the text rather than a screenshot of it, so it is searchable. Remove any token or credential first.
      render: shell
    validations:
      required: false
