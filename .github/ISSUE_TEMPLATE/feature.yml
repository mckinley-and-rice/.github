name: Feature request
description: Something the product should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where it stopped. Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: If there is no workaround, say so. That is useful information.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including any you rejected, and why.
    validations:
      required: false
